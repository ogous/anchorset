# Third-party text: the grading texts that two MIT-licensed tools ship, copied as text files and recorded in the logs those
# tools wrote. The copyright lines are those of each release's own licence file (inspect_ai 0.3.275 and 0.3.286, promptfoo 0.123.1 and 0.125.1).
# These annotations override the file and come last, so no earlier block applies to these paths; NOTICE names the tools.
# test/licence-map.test.ts finds every file that holds such a text and checks that it is listed here.
[[annotations]]
path = ["examples/importers/inspect/instructions.txt", "examples/importers/inspect/template.txt"]
SPDX-FileCopyrightText = "2024 UK AI Security Institute"
SPDX-License-Identifier = "MIT"
precedence = "override"

